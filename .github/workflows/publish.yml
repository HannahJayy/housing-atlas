# Builds Housing Atlas on GitHub's servers every week and publishes it with GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions". Then Actions > Publish Housing Atlas > Run workflow.
# Optional repository settings (Settings > Secrets and variables > Actions):
#   variable CONTACT_EMAIL  - your e-mail, sent to data providers; the BLS asks for one
#   secret   CENSUS_API_KEY - free key from api.census.gov/data/key_signup.html (smaller downloads)
#   secret   BLS_API_KEY    - free key from data.bls.gov/registrationEngine (higher payroll-jobs limits)
name: Publish Housing Atlas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 0"   # Sundays 09:17 UTC (early Sunday morning in the U.S.)

permissions:
  contents: write   # lets the weekly run save last-update.txt, which keeps the schedule from being paused
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Get the app
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore last week's downloads
        uses: actions/cache/restore@v4
        with:
          path: data
          key: housing-data-${{ github.run_id }}
          restore-keys: housing-data-

      - name: Download the latest housing data
        continue-on-error: true   # one provider being down should not stop the rest from publishing
        env:
          HOUSING_ATLAS_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
          HOUSING_ATLAS_CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HOUSING_ATLAS_BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python app.py update

      - name: Save downloads for next week
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data
          key: housing-data-${{ github.run_id }}

      - name: Build the website
        run: python app.py export-static site --hosted

      - name: Note the update date (keeps the weekly schedule active)
        continue-on-error: true
        run: |
          date -u +"Housing Atlas data last updated %Y-%m-%d %H:%M UTC" > last-update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-update.txt
          git commit -m "Weekly data update" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Check that GitHub Pages is turned on
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
