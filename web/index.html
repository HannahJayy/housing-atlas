<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Housing Atlas</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#256abf">
  <meta name="apple-mobile-web-app-title" content="Housing Atlas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply saved theme before first paint (no flash)
    try { var t = localStorage.getItem('ha-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/map" aria-label="Housing Atlas home">
      <img src="img/icon.svg" alt="" width="26" height="26">
      <span>Housing Atlas</span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="Main">
      <a href="#/map" data-nav="map">Map</a>
      <a href="#/rankings" data-nav="rankings">Rankings</a>
      <a href="#/compare" data-nav="compare">Compare</a>
      <a href="#/national" data-nav="national">National</a>
      <a href="#/watchlist" data-nav="watchlist">Watchlist</a>
      <a href="#/sources" data-nav="sources">Data &amp; Sources</a>
      <a href="#/methodology" data-nav="methodology">Methodology</a>
    </nav>
    <div class="search" role="search">
      <input id="search" type="search" placeholder="Search a state, metro, county, city or ZIP" autocomplete="off"
             aria-label="Search places">
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <a class="btn btn-ghost" id="account-btn" href="#/account">Sign in</a>
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
    </div>
  </header>
  <div id="update-banner" class="update-banner" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
